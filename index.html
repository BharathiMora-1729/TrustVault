<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TrustVault - Secure Document Sharing Platform | Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-logo"><i class="bi bi-shield-lock-fill"></i></div>
        <h1 class="auth-title">TrustVault</h1>
        <p class="auth-subtitle">Secure Enterprise Document Sharing Platform</p>
      </div>

      <form id="login-form">
        <div class="mb-3">
          <label for="email" class="form-label font-semibold">Email Address</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-envelope"></i></span>
            <input type="email" class="form-control" id="email" required placeholder="name@company.com" autocomplete="email">
          </div>
        </div>

        <div class="mb-3">
          <label for="password" class="form-label font-semibold">Password</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-key"></i></span>
            <input type="password" class="form-control" id="password" required placeholder="Enter password" autocomplete="current-password">
            <span class="input-group-text password-toggle" id="toggle-password">
              <i class="bi bi-eye" id="toggle-icon"></i>
            </span>
          </div>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-4">
          <div class="form-check">
            <input type="checkbox" class="form-check-input" id="remember-me">
            <label class="form-check-label text-muted small" for="remember-me">Remember me</label>
          </div>
        </div>

        <button type="submit" class="btn btn-primary w-100 py-2 font-semibold" id="login-btn">
          <span id="btn-text">Log In</span>
          <span id="btn-spinner" class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
        </button>
      </form>

      <div class="mt-4 text-center">
        <p class="text-muted small mb-0">Don't have an account? <a href="/register.html" class="text-primary text-decoration-none font-semibold">Register here</a></p>
      </div>

      <div class="mt-4 p-3 bg-light rounded border small">
        <strong class="d-block mb-1 text-dark"><i class="bi bi-info-circle me-1"></i> Pre-seeded System Admin Credentials:</strong>
        <span class="text-muted">Email:</span> <code>admin@trustvault.com</code><br>
        <span class="text-muted">Password:</span> <code>AdminPassword123!</code>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      // Fast non-blocking background auth check
      try {
        const data = await apiCall('/api/auth/me', 'GET', null, 3000);
        if (data && data.user) {
          redirectToRoleDashboard(data.user.role);
          return;
        }
      } catch (e) {}

      // Toggle Password Visibility
      const toggleBtn = document.getElementById('toggle-password');
      const passInput = document.getElementById('password');
      const toggleIcon = document.getElementById('toggle-icon');

      toggleBtn.addEventListener('click', () => {
        const type = passInput.getAttribute('type') === 'password' ? 'text' : 'password';
        passInput.setAttribute('type', type);
        toggleIcon.className = type === 'password' ? 'bi bi-eye' : 'bi bi-eye-slash';
      });

      // Handle Form Submit with try/catch/finally and 10s AbortController timeout protection
      const loginForm = document.getElementById('login-form');
      const loginBtn = document.getElementById('login-btn');
      const btnText = document.getElementById('btn-text');
      const btnSpinner = document.getElementById('btn-spinner');

      loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();

        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;

        if (!email || !password) {
          showToast('Please fill in both email and password fields.', 'error');
          return;
        }

        // Set Loading State
        btnText.textContent = 'Authenticating...';
        btnSpinner.classList.remove('d-none');
        loginBtn.disabled = true;

        try {
          // Send login request with 10-second timeout abort threshold
          const res = await apiCall('/api/auth/login', 'POST', { email, password }, 10000);
          showToast(res.message, 'success');
          
          // Redirect to appropriate dashboard based on database role
          redirectToRoleDashboard(res.user.role);
        } catch (err) {
          // Display user feedback toast
          showToast(err.message, 'error');
        } finally {
          // ALWAYS reset button state in finally block to prevent button sticking
          btnText.textContent = 'Log In';
          btnSpinner.classList.add('d-none');
          loginBtn.disabled = false;
        }
      });
    });
  </script>
</body>
</html>
